name: Publish Go module

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify release metadata
        run: python3 scripts/check-release.py
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: gofmt
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            gofmt -d .
            exit 1
          fi

      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

      - name: Index module on proxy.golang.org
        if: github.ref_type == 'tag'
        run: |
          GOPROXY=https://proxy.golang.org go list -m "github.com/Imazeohq/imazeo-go@${{ github.ref_name }}"

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag
